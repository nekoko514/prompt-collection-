<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#2b121f"/>
      <stop offset="42%" stop-color="#130912"/>
      <stop offset="82%" stop-color="#07040a"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
    <linearGradient id="ivoryText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2eadb"/>
      <stop offset="56%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#bfb3a2"/>
    </linearGradient>
    <linearGradient id="goldRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#caa86e" stop-opacity="0"/>
      <stop offset="16%" stop-color="#8a3a4a" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#e2c993" stop-opacity="0.82"/>
      <stop offset="84%" stop-color="#8a3a4a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#caa86e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roseStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dca4ad"/>
      <stop offset="54%" stop-color="#c4727e"/>
      <stop offset="100%" stop-color="#8a3a4a"/>
    </linearGradient>
    <filter id="softRoseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.77  0 0.42 0 0 0.28  0 0 0.5 0 0.36  0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="514"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <pattern id="pinstripe" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ffffff" stroke-opacity="0.018"/>
      <path d="M0 0V4" stroke="#000000" stroke-opacity="0.12"/>
    </pattern>
    <style>
      .serif {
        font-family: "Cormorant Garamond", "Cormorant SC", Georgia, "Times New Roman", serif;
      }
      .jp {
        font-family: "Yu Mincho", "Hiragino Mincho ProN", "BIZ UDPMincho", serif;
      }
    </style>
  </defs>

